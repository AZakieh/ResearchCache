[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchcache"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "starlette>=0.37",

    # Async HTTP client (origin fetches + FastAPI test client)
    "httpx>=0.27",

    # Configuration
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "greenlet>=3.0",

    # Cache metadata store
    "redis[asyncio]>=5.0",

    # Object store (R2 / S3)
    "aiobotocore>=2.13",

    # Structured logging
    "structlog>=24.0",

    # YAML (allow-list)
    "pyyaml>=6.0",

    # Templating (benchmark page)
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "fakeredis[aioredis]>=2.23",
    "ruff>=0.4",
    "pip-tools>=7.4",
    "safety>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["researchcache*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
